[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagconsensus"
version = "1.0.0"
description = "Offline annotation agreement review and adjudication ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<6",
]

[project.scripts]
tagconsensus = "tagconsensus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tagconsensus = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
